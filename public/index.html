<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空の易 - 占い結果</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Hiragino Kaku Gothic ProN, クギノ, meiryo, sans-serif;
            background-color: #000;
            color: #fff;
        }

        /* 背景動画の固定設置 */
        #video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            background-size: cover;
            object-fit: cover;
        }

        /* 画面全体のオーバーレイ（少し暗くして文字を見やすくする） */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: -99;
        }

        /* コンテナ（上下中央配置） */
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 動画で見せてくれた「美しい半透明カード」の再現 */
        .fortune-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .weather-info {
            font-size: 14pt;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .hexagram-title {
            font-size: 24pt;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.03em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .hexagram-sub {
            font-size: 11pt;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
            margin: 15px 0;
            width: 100%;
        }

        /* 鎧さんの見守り助言エリア */
        .advice-box {
            text-align: left;
            font-size: 11pt;
            line-height: 1.6;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.15);
            padding: 14px;
            border-radius: 14px;
            border-left: 4px solid rgba(255, 255, 255, 0.4);
        }

        .advice-label {
            font-size: 9pt;
            font-weight: bold;
            opacity: 0.6;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }

        /* ちいかわ達のセリフエリア */
        .character-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            text-align: left;
            font-size: 10pt;
            line-height: 1.5;
            opacity: 0.9;
        }

        .char-line {
            margin-bottom: 4px;
        }
        .char-line:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="video-background" id="bg-video">
        <source src="" type="video/mp4" id="video-source">
    </video>
    <div class="overlay"></div>

    <div class="container">
        <div class="fortune-card">
            <div class="weather-info" id="weather-text">⚡ 雷火豊 (らいかほう)</div>
            <div class="hexagram-title" id="hexagram-name">雷火豊</div>
            <div class="hexagram-sub" id="line-text">六二 / 増していく華やかさ</div>
            
            <div class="divider"></div>
            
            <div class="advice-box">
                <div class="advice-label">💬 鎧さんの見守り助言</div>
                <div id="advice-text">3人が身を寄せ合って空を見上げているな。今は無理せず、美味しいものでもハフムシャ食べてゆっくり過ごすといいぞ。</div>
            }</div>

            <div class="character-box">
                <div class="char-line" id="chiikawa-text">ちいかわ：ちょっとこわい…</div>
                <div class="char-line" id="hachiware-text">ハチワレ：なんとかなりそう？</div>
                <div class="char-line" id="usagi-text">うさぎ：ヤハ！</div>
            </div>
        </div>
    </div>

    <script>
        // URLの後ろについたデータを解析して画面を書き換える
        const urlParams = new URLSearchParams(window.location.search);
        
        if(urlParams.has('name')) {
            document.getElementById('hexagram-name').innerText = urlParams.get('name');
            document.getElementById('weather-text').innerText = urlParams.get('icon') + " " + urlParams.get('weather') + " (" + urlParams.get('emotion') + ")";
            document.getElementById('line-text').innerText = urlParams.get('line_name') + " / " + urlParams.get('line_emotion');
            document.getElementById('advice-text').innerText = urlParams.get('advice');
            
            document.getElementById('chiikawa-text').innerText = "ちいかわ：「" + urlParams.get('chiikawa') + "」";
            document.getElementById('hachiware-text').innerText = "ハチワレ：「" + urlParams.get('hachiware') + "」";
            document.getElementById('usagi-text').innerText = "うさぎ：「" + urlParams.get('usagi') + "」";

            // 動画のURLを動的にセットして再生
            const videoSrc = urlParams.get('video');
            document.getElementById('video-source').src = videoSrc;
            document.getElementById('video-background').load();
        }
    </script>
</body>
</html>
