services:
  - type: web
    name: line-fortune-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    env:
      # ここは Render 側の「Environment」画面で、LINE のキーを入力してOK
      # GitHub にはソースコードだけを置く（シークレットは入れない）
      # LINE_CHANNEL_SECRET: "ここは入れない"
      # LINE_CHANNEL_ACCESS_TOKEN: "ここも入れない"
    # 環境変数は、Render のダッシュボードで「Environment」タブから追加