<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>空の易 - キャラおしゃべり図鑑</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; 
            min-height: 100vh;
            min-height: 100dvh; 
            font-family: 'Zen Maru Gothic', sans-serif;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; background-color: #0f172a;
            overflow-x: hidden;
            color: #f8fafc;
        }

        /* ふわふわ横スクロール用の背景レイヤー */
        .bg-layer {
            position: fixed;
            top: -10vh; left: -25vw; width: 150vw; height: 120vh; 
            background-size: cover; background-position: center;
            z-index: -2;
            animation: fluffyScroll 40s alternate infinite ease-in-out;
        }

        @keyframes fluffyScroll {
            0% { transform: translate(15vw, 2vh) scale(1); }    
            50% { transform: translate(-15vw, -3vh) scale(1.05); } 
            100% { transform: translate(5vw, 0vh) scale(1.02); }   
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.5));
            z-index: -1;
        }

        #weather-effect {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }

        .ui-wrapper {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column; align-items: center;
        }

        .card-floater { animation: floatAnimation 5s ease-in-out infinite; width: 100%; }
        @keyframes floatAnimation {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* 🌟 ミニマルで文字が読みやすいダークカード */
        .card {
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 35px 25px; border-radius: 24px;
            text-align: left; width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            opacity: 0; transform: scale(0.98);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear { to { opacity: 1; transform: scale(1); } }

        .animate-item { opacity: 0; transform: translateY(8px); animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.35s; } .delay-4 { animation-delay: 0.45s; } .delay-5 { animation-delay: 0.6s; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* ヘッダー周り */
        .header-area { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.5rem; margin-bottom: 6px; color: #ffffff; letter-spacing: 1px; }
        .sky-title { font-size: 0.9rem; color: #cbd5e1; font-weight: 400; }

        /* 情景テキスト */
        #scene {
            font-size: 0.95rem; line-height: 1.7; color: #e2e8f0;
            margin-bottom: 28px; padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 🌟 ミニマルなセリフ表示（文字色でキャラクターを表現） */
        .dialogue-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
        .dialogue-line { font-size: 0.95rem; line-height: 1.6; font-weight: 500; display: flex; flex-direction: column; }
        .char-name { font-size: 0.75rem; opacity: 0.7; margin-bottom: 2px; }
        
        /* 暗い背景で美しく光るパステルカラー */
        .chiikawa-text { color: #fda4af; } /* やわらかいピンク */
        .hachiware-text { color: #93c5fd; } /* クリアな水色 */
        .usagi-text { color: #fde047; } /* あざやかな黄色 */

        /* 鎧さんの言葉 */
        .advice-box { padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .yoroi-text { color: #fdba74; font-size: 0.9rem; line-height: 1.6; } /* あたたかいオレンジ */
        .yoroi-name { font-size: 0.75rem; opacity: 0.7; color: #fdba74; margin-bottom: 4px; display: block; }

        .notice { font-size: 0.7rem; color: #64748b; margin-top: 20px; text-align: center; }

        /* 天候エフェクトCSS（そのままキープ） */
        .rain { position: absolute; background: rgba(255,255,255,0.4); width: 1.5px; height: 25px; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(105vh); } }
        .snow { position: absolute; color: rgba(255,255,255,0.85); animation: snowFall linear infinite; }
        @keyframes snowFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(105vh) translateX(40px) rotate(360deg); opacity: 0; } }
        .sparkle { position: absolute; border-radius: 50%; animation: riseUp ease-in-out infinite; }
        @keyframes riseUp { 0% { transform: translateY(105vh) scale(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-5vh) scale(1.2); opacity: 0; } }
        .wind-line { position: absolute; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.3), rgba(255,255,255,0)); height: 2px; animation: blow linear infinite; }
        @keyframes blow { 0% { transform: translateX(-100vw); } 100% { transform: translateX(100vw); } }
        .lightning-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; z-index: 1; animation: lightning 5s ease-in-out infinite; }
        @keyframes lightning { 0%, 92%, 94%, 96%, 100% { opacity: 0; } 93%, 95% { opacity: 0.2; } }
        .cloud-particle { position: absolute; background: rgba(255,255,255,0.12); border-radius: 50%; filter: blur(25px); animation: drift linear infinite; }
        @keyframes drift { 0% { transform: translateX(-250px); } 100% { transform: translateX(105vw); } }
    </style>
</head>
<body>

    <div id="bg-layer" class="bg-layer"></div>
    <div id="bg-overlay" class="bg-overlay"></div>
    <div id="weather-effect"></div>

    <div id="ui-wrapper" class="ui-wrapper">
        <div class="card-floater">
            <div class="card" id="main-card">
                
                <div class="header-area animate-item delay-1">
                    <h1 id="title">読み込み中...</h1>
                    <div id="sky-title" class="sky-title"></div>
                </div>
                
                <p id="scene" class="animate-item delay-2">空の様子を探しています...</p>
                
                <div class="dialogue-container">
                    <div class="dialogue-line chiikawa-text animate-item delay-3">
                        <span class="char-name">ちいかわ</span>
                        <span id="chiikawa">...</span>
                    </div>
                    <div class="dialogue-line hachiware-text animate-item delay-4">
                        <span class="char-name">ハチワレ</span>
                        <span id="hachiware">...</span>
                    </div>
                    <div class="dialogue-line usagi-text animate-item delay-5">
                        <span class="char-name">うさぎ</span>
                        <span id="usagi">...</span>
                    </div>
                </div>

                <div class="advice-box animate-item delay-5">
                    <span class="yoroi-name">鎧さんの言葉</span>
                    <p id="advice-text" class="yoroi-text">...</p>
                </div>

                <p id="tap-notice" class="notice">画面タップでBGM再生・停止</p>
                <audio id="bgm-player" loop></audio>
            </div>
        </div>
    </div>

    <script>
        const speciesImages = {
            "創空族": "sky.png", "受雲族": "cloud.png", "雷芽族": "thunder.png", "雨巡族": "rain.png",
            "風旅族": "wind.png", "虹結族": "rainbow.png", "雪守族": "snow.png", "炎灯族": "fire.png"
        };

        const params = new URLSearchParams(window.location.search);
        const hid = params.get('hid') || "1"; 
        const l_name = params.get('l_name') || "1"; 

        fetch(`/api/fortune?hid=${hid}&l_name=${encodeURIComponent(l_name)}`)
            .then(res => res.json())
            .then(data => {
                const species = data.species_8 || "創空族"; 
                const imageFile = speciesImages[species] || "sky.png"; 
                
                document.getElementById('bg-layer').style.backgroundImage = `url('${imageFile}')`;
                startWeatherEffect(species);

                document.getElementById('title').innerText = `${data.name} (${l_name})`;
                document.getElementById('sky-title').innerText = `${data.sky_name || data.soranoeki_sky || "不思議な空"}`;
                document.getElementById('scene').innerText = data.chiikawa_scene;
                
                document.getElementById('chiikawa').innerText = `「${data.chiikawa || '…'}」`;
                document.getElementById('hachiware').innerText = `「${data.hachiware || '…'}」`;
                document.getElementById('usagi').innerText = `「${data.usagi || '…'}」`;
                document.getElementById('advice-text').innerText = data.advice;

                if (data.bgm) {
                    const audio = document.getElementById('bgm-player');
                    audio.src = data.bgm;
                    
                    // カード全体ではなく画面のどこをタップしてもBGMが鳴るようにシンプル化
                    document.body.addEventListener('click', () => {
                        if (audio.paused) {
                            audio.play().catch(e => console.log(e));
                            document.getElementById('tap-notice').innerText = "🔊 BGM再生中";
                        } else {
                            audio.pause();
                            document.getElementById('tap-notice').innerText = "画面タップでBGM再生・停止";
                        }
                    });
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('title').innerText = "😭 エラー";
                document.getElementById('scene').innerText = "お空のデータがうまく届かなかったみたい…";
            });

        function startWeatherEffect(species) {
            const container = document.getElementById('weather-effect');
            container.innerHTML = ''; 
            
            if (species === "雨巡族") {
                for(let i=0; i<45; i++) {
                    let drop = document.createElement('div'); drop.className = 'rain';
                    drop.style.left = Math.random() * 100 + 'vw'; drop.style.top = Math.random() * -50 + 'px';
                    drop.style.animationDuration = (Math.random() * 0.4 + 0.4) + 's'; drop.style.animationDelay = Math.random() * 2 + 's';
                    container.appendChild(drop);
                }
            } else if (species === "雪守族") {
                for(let i=0; i<25; i++) {
                    let flake = document.createElement('div'); flake.className = 'snow'; flake.innerHTML = Math.random() > 0.4 ? '❄' : '･';
                    flake.style.left = Math.random() * 100 + 'vw'; flake.style.fontSize = (Math.random() * 14 + 10) + 'px';
                    flake.style.animationDuration = (Math.random() * 3 + 3) + 's'; flake.style.animationDelay = Math.random() * 5 + 's';
                    container.appendChild(flake);
                }
            } else if (species === "雷芽族") {
                let flash = document.createElement('div'); flash.className = 'lightning-flash'; container.appendChild(flash);
                for(let i=0; i<20; i++) {
                    let drop = document.createElement('div'); drop.className = 'rain';
                    drop.style.left = Math.random() * 100 + 'vw'; drop.style.animationDuration = (Math.random() * 0.4 + 0.4) + 's';
                    container.appendChild(drop);
                }
            } else if (species === "創空族") {
                for(let i=0; i<20; i++) {
                    let sparkle = document.createElement('div'); sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * 100 + 'vw'; sparkle.style.width = sparkle.style.height = (Math.random() * 6 + 4) + 'px';
                    sparkle.style.background = 'radial-gradient(circle, #fffdf0, rgba(251,191,36,0.6))'; sparkle.style.boxShadow = '0 0 10px #fef08a';
                    sparkle.style.animationDuration = (Math.random() * 4 + 4) + 's'; sparkle.style.animationDelay = Math.random() * 4 + 's';
                    container.appendChild(sparkle);
                }
            } else if (species === "炎灯族") {
                for(let i=0; i<20; i++) {
                    let spark = document.createElement('div'); spark.className = 'sparkle';
                    spark.style.left = Math.random() * 100 + 'vw'; spark.style.width = spark.style.height = (Math.random() * 5 + 3) + 'px';
                    spark.style.background = 'radial-gradient(circle, #fff, #f97316)'; spark.style.boxShadow = '0 0 12px #ea580c';
                    spark.style.animationDuration = (Math.random() * 3 + 3) + 's'; spark.style.animationDelay = Math.random() * 3 + 's';
                    container.appendChild(spark);
                }
            } else if (species === "風旅族") {
                for(let i=0; i<8; i++) {
                    let wind = document.createElement('div'); wind.className = 'wind-line';
                    wind.style.top = (Math.random() * 100) + 'vh'; wind.style.width = (Math.random() * 150 + 100) + 'px';
                    wind.style.animationDuration = (Math.random() * 1.6 + 1.4) + 's'; wind.style.animationDelay = Math.random() * 3 + 's';
                    container.appendChild(wind);
                }
            } else if (species === "虹結族") {
                const colors = ['rgba(254,205,211,0.45)', 'rgba(191,219,254,0.45)', 'rgba(253,230,138,0.45)', 'rgba(187,247,208,0.45)'];
                for(let i=0; i<15; i++) {
                    let bubble = document.createElement('div'); bubble.className = 'sparkle'; bubble.style.left = Math.random() * 100 + 'vw';
                    const size = (Math.random() * 25 + 15) + 'px'; bubble.style.width = bubble.style.height = size;
                    bubble.style.background = colors[Math.random() % colors.length]; bubble.style.border = '1px solid rgba(255,255,255,0.25)';
                    bubble.style.animationDuration = (Math.random() * 6 + 5) + 's'; bubble.style.animationDelay = Math.random() * 5 + 's';
                    container.appendChild(bubble);
                }
            } else if (species === "受雲族") {
                for(let i=0; i<6; i++) {
                    let cloud = document.createElement('div'); cloud.className = 'cloud-particle';
                    cloud.style.top = (Math.random() * 70) + 'vh'; const size = (Math.random() * 160 + 140) + 'px';
                    cloud.style.width = cloud.style.height = size; cloud.style.animationDuration = (Math.random() * 25 + 20) + 's';
                    cloud.style.animationDelay = Math.random() * -12 + 's'; container.appendChild(cloud);
                }
            }
        }
    </script>
</body>
</html>
