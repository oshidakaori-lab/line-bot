<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>空の易 - キャラおしゃべり図鑑</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; 
            min-height: 100vh;
            min-height: 100dvh; 
            font-family: 'M PLUS Rounded 1c', sans-serif;
            display: flex; justify-content: center; align-items: center;
            padding: 20px 15px; 
            background-color: transparent; 
            overflow-x: hidden;
            color: #f8fafc;
            cursor: pointer;
        }

        /* 🌟 背景のシネマティックカメラワーク（30秒かけて右へ） */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; 
            background-size: cover; background-position: center;
            z-index: -2;
            animation: cameraReadPan 30s ease-in-out infinite alternate;
        }

        @keyframes cameraReadPan {
            0% { transform: scale(1.1); transform-origin: 0% 50%; }
            100% { transform: scale(1.5); transform-origin: 100% 50%; }
        }

        #weather-effect {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }

        .ui-wrapper {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column; align-items: center;
            gap: 20px;
            padding: 30px 0;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; /* 右外の待機キャラで画面が横揺れしないようにする */
        }

        /* ふわふわ浮遊アニメーション */
        .floater-1 { animation: floatAnim1 5.5s ease-in-out infinite; width: 100%; }
        .floater-2 { animation: floatAnim2 6.5s ease-in-out infinite 0.5s; width: 100%; }
        .floater-3 { animation: floatAnim3 6s ease-in-out infinite 1s; width: 100%; }

        @keyframes floatAnim1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        @keyframes floatAnim2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        @keyframes floatAnim3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        /* ベースの文字囲いスタイル */
        .card-block {
            border-radius: 32px; 
            padding: 24px 20px; 
            text-align: left; width: 100%;
            opacity: 0; 
            transition: all 0.6s ease;
        }

        /* 🌟 [モード1] ゆらぎモード（フレームイン ＋ ゆらぎ） */
        .mode-normal .card-block {
            /* スケールではなく、右（50vw）からスライドインしてくる動きに変更 */
            animation: frameInRight 1s cubic-bezier(0.16, 1, 0.3, 1) forwards, 
                       boxPulse 6s infinite alternate ease-in-out 1s;
        }

        /* ブロックごとの登場タイミング */
        .mode-normal .delay-1 { animation-delay: 0.5s, 1.5s; } /* タイトルは最初 */
        .mode-normal .delay-2 { animation-delay: 2.0s, 3.0s; } /* 会話枠は少し後 */
        .mode-normal .delay-3 { animation-delay: 7.0s, 8.0s; } /* 鎧さんは最後に合流 */

        @keyframes frameInRight {
            0% { opacity: 0; transform: translateX(30vw); } /* 画面の右外から */
            100% { opacity: 1; transform: translateX(0); }  /* 定位置へ */
        }

        @keyframes boxPulse {
            0% { 
                background: rgba(15, 23, 42, 0.0); border: 2px solid rgba(255, 255, 255, 0.05); box-shadow: none;
                backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            }
            100% { 
                background: rgba(15, 23, 42, 0.4); border: 2px solid rgba(255, 255, 255, 0.3); 
                box-shadow: 0 8px 24px rgba(0,0,0,0.15), inset 0 0 15px rgba(255,255,255,0.05);
                backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            }
        }

        /* 🌟 キャラクター個別のフレームイン設定 */
        .dialogue-line {
            opacity: 0; /* 最初は見えない状態 */
            transform: translateX(40px); /* 少し右にずらしておく */
        }
        
        .mode-normal .char-reveal {
            animation: charSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes charSlideIn {
            0% { opacity: 0; transform: translateX(40px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* カメラ移動に合わせて順番に登場するディレイ設定！ */
        .mode-normal .delay-chiikawa { animation-delay: 3.0s; }
        .mode-normal .delay-hachiware { animation-delay: 4.5s; }
        .mode-normal .delay-usagi { animation-delay: 5.8s; }

        /* [モード2] くっきり読書モード */
        .mode-reading .card-block {
            opacity: 1; transform: translateX(0);
            background: rgba(15, 23, 42, 0.85) !important; 
            border: 2px solid rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(10px) !important; -webkit-backdrop-filter: blur(10px) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.1) !important;
            animation: none !important;
        }
        /* 読書モード時は文字もすべて強制表示 */
        .mode-reading .dialogue-line { opacity: 1; transform: translateX(0); animation: none !important; }

        /* [モード3] ギャラリーモード */
        .mode-gallery .ui-wrapper {
            opacity: 0; pointer-events: none; transform: scale(1.05);
        }

        #gallery-hint {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 0.9rem; font-weight: 500;
            letter-spacing: 1px; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease; text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .mode-gallery #gallery-hint { opacity: 1; }

        /* 蛍のようにぽわっと光るエフェクト（そのまま） */
        @keyframes firefly {
            0%, 100% { text-shadow: 0 0 2px currentColor; opacity: 0.85; }
            50% { text-shadow: 0 0 12px currentColor, 0 0 20px currentColor; opacity: 1; }
        }
        .firefly-text-1 { animation: firefly 4.0s ease-in-out infinite 0.7s; }
        .firefly-text-2 { animation: firefly 4.8s ease-in-out infinite 0.8s; }
        .firefly-text-3 { animation: firefly 3.5s ease-in-out infinite 0.95s; }
        .firefly-text-4 { animation: firefly 5.2s ease-in-out infinite 1.05s; }
        .firefly-text-5 { animation: firefly 3.9s ease-in-out infinite 1.2s; }

        /* 文字サイズと装飾 */
        .header-area { text-align: center; margin-bottom: 16px; }
        h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 8px; color: #ffffff; letter-spacing: 1.5px; }
        .sky-title { font-size: 1.15rem; color: #f8fafc; font-weight: 500; letter-spacing: 1px; }
        #scene { font-size: 1.1rem; line-height: 1.8; color: #ffffff; font-weight: 500; text-align: center; }
        .dialogue-container { display: flex; flex-direction: column; gap: 20px; }
        .dialogue-line { font-size: 1.15rem; line-height: 1.7; font-weight: 800; display: flex; flex-direction: column; letter-spacing: 0.5px; }
        .char-name { font-size: 0.85rem; opacity: 0.9; margin-bottom: 6px; color: #ffffff; font-weight: 700; }
        .chiikawa-text { color: #fecdd3; } 
        .hachiware-text { color: #bfdbfe; } 
        .usagi-text { color: #fef08a; } 
        .advice-box { text-align: left; }
        .yoroi-name { font-size: 0.85rem; opacity: 0.9; color: #ffffff; margin-bottom: 8px; display: block; font-weight: 700; }
        .yoroi-text { color: #fed7aa; font-size: 1.15rem; line-height: 1.7; font-weight: 800; letter-spacing: 0.5px; } 
        .notice { font-size: 0.85rem; color: #ffffff; margin-top: 20px; text-align: center; font-weight: 500; }

        /* 天候エフェクト */
        .rain { position: absolute; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.7)); width: 2px; height: 35px; border-radius: 2px; box-shadow: 0 0 8px rgba(255,255,255,0.4); animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh) scaleY(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(105vh) scaleY(1.5); opacity: 0; } }
        .snow { position: absolute; color: rgba(255,255,255,0.95); text-shadow: 0 0 10px rgba(255,255,255,0.6); animation: snowFall linear infinite; }
        @keyframes snowFall { 0% { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(105vh) translateX(60px) rotate(360deg); opacity: 0; } }
        .sparkle { position: absolute; border-radius: 50%; filter: blur(1px); animation: riseUp ease-in-out infinite; mix-blend-mode: screen; }
        @keyframes riseUp { 0% { transform: translateY(105vh) scale(0.5); opacity: 0; } 30% { opacity: 0.8; } 70% { opacity: 0.8; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        .wind-line { position: absolute; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.4), rgba(255,255,255,0)); height: 3px; border-radius: 50%; filter: blur(2px); animation: blow cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes blow { 0% { transform: translateX(-50vw) scaleX(0.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(150vw) scaleX(2); opacity: 0; } }
        .lightning-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top, #fff, rgba(255,255,255,0)); opacity: 0; pointer-events: none; z-index: -1; animation: lightning 6s ease-in-out infinite; mix-blend-mode: overlay; }
        @keyframes lightning { 0%, 91%, 94%, 97%, 100% { opacity: 0; } 92%, 96% { opacity: 0.4; } 95% { opacity: 0.8; } }
        .cloud-particle { position: absolute; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; animation: drift linear infinite; mix-blend-mode: screen; }
        @keyframes drift { 0% { transform: translateX(-30vw) scale(0.8); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(120vw) scale(1.2); opacity: 0; } }
    </style>
</head>
<body class="mode-normal">

    <div id="bg-layer" class="bg-layer"></div>
    <div id="weather-effect"></div>

    <div id="gallery-hint">画面タップでもとに戻るよ</div>

    <div id="ui-wrapper" class="ui-wrapper">
        
        <div class="floater-1">
            <div class="card-block delay-1">
                <div class="header-area">
                    <h1 id="title" class="firefly-text-1">読み込み中...</h1>
                    <div id="sky-title" class="sky-title firefly-text-1"></div>
                </div>
                <p id="scene" class="firefly-text-1">空の様子を探しています...</p>
            </div>
        </div>
        
        <div class="floater-2">
            <div class="card-block delay-2">
                <div class="dialogue-container">
                    <div class="dialogue-line chiikawa-text firefly-text-1 char-reveal delay-chiikawa">
                        <span class="char-name">ちいかわ</span>
                        <span id="chiikawa">...</span>
                    </div>
                    <div class="dialogue-line hachiware-text firefly-text-2 char-reveal delay-hachiware">
                        <span class="char-name">ハチワレ</span>
                        <span id="hachiware">...</span>
                    </div>
                    <div class="dialogue-line usagi-text firefly-text-3 char-reveal delay-usagi">
                        <span class="char-name">うさぎ</span>
                        <span id="usagi">...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="floater-3">
            <div class="card-block delay-3">
                <div class="advice-box">
                    <span class="yoroi-name">鎧さんの言葉</span>
                    <p id="advice-text" class="yoroi-text firefly-text-4">...</p>
                </div>
                <p id="tap-notice" class="notice firefly-text-5">タップで文字をくっきり＆BGM再生</p>
                <audio id="bgm-player" loop></audio>
            </div>
        </div>

    </div>

    <script>
        const speciesImages = {
            "創空族": "sky.png", "受雲族": "cloud.png", "雷芽族": "thunder.png", "雨巡族": "rain.png",
            "風旅族": "wind.png", "虹結族": "rainbow.png", "雪守族": "snow.png", "炎灯族": "fire.png"
        };

        const params = new URLSearchParams(window.location.search);
        const hid = params.get('hid') || "1"; 
        const l_name = params.get('l_name') || "1"; 

        fetch(`/api/fortune?hid=${hid}&l_name=${encodeURIComponent(l_name)}`)
            .then(res => res.json())
            .then(data => {
                const species = data.species_8 || "創空族"; 
                const imageFile = speciesImages[species] || "sky.png"; 
                
                document.getElementById('bg-layer').style.backgroundImage = `url('${imageFile}')`;
                startWeatherEffect(species);

                document.getElementById('title').innerText = `${data.name} (${l_name})`;
                document.getElementById('sky-title').innerText = `${data.sky_name || data.soranoeki_sky || "不思議な空"}`;
                document.getElementById('scene').innerText = data.chiikawa_scene;
                
                document.getElementById('chiikawa').innerText = `「${data.chiikawa || '…'}」`;
                document.getElementById('hachiware').innerText = `「${data.hachiware || '…'}」`;
                document.getElementById('usagi').innerText = `「${data.usagi || '…'}」`;
                document.getElementById('advice-text').innerText = data.advice;

                if (data.bgm) {
                    const audio = document.getElementById('bgm-player');
                    audio.src = data.bgm;
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('title').innerText = "😭 エラー";
                document.getElementById('scene').innerText = "お空のデータがうまく届かなかったみたい…";
            });

        let currentMode = 0; 
        
        document.body.addEventListener('click', () => {
            currentMode = (currentMode + 1) % 3;
            const body = document.body;
            const notice = document.getElementById('tap-notice');
            const audio = document.getElementById('bgm-player');
            
            if (audio.paused && audio.src) {
                audio.play().catch(e => console.log("BGM再生エラー:", e));
            }

            body.classList.remove('mode-normal', 'mode-reading', 'mode-gallery');

            if (currentMode === 0) {
                body.classList.add('mode-normal');
                notice.innerText = "タップで文字をくっきり";
            } else if (currentMode === 1) {
                body.classList.add('mode-reading');
                notice.innerText = "タップで背景ギャラリーモードへ";
            } else if (currentMode === 2) {
                body.classList.add('mode-gallery');
            }
        });

        function startWeatherEffect(species) {
            const container = document.getElementById('weather-effect');
            container.innerHTML = ''; 
            
            if (species === "雨巡族") {
                for(let i=0; i<60; i++) {
                    let drop = document.createElement('div'); drop.className = 'rain';
                    drop.style.left = Math.random() * 100 + 'vw'; drop.style.top = Math.random() * -100 + 'px';
                    const zIndex = Math.random(); drop.style.transform = `scale(${zIndex * 0.8 + 0.4})`;
                    drop.style.opacity = zIndex * 0.7 + 0.3; drop.style.animationDuration = (Math.random() * 0.3 + 0.4) + 's'; 
                    drop.style.animationDelay = Math.random() * 2 + 's'; container.appendChild(drop);
                }
            } else if (species === "雪守族") {
                const snowChars = ['❄', '･', '❅', '°'];
                for(let i=0; i<40; i++) {
                    let flake = document.createElement('div'); flake.className = 'snow'; 
                    flake.innerHTML = snowChars[Math.floor(Math.random() * snowChars.length)];
                    flake.style.left = Math.random() * 100 + 'vw'; flake.style.fontSize = (Math.random() * 20 + 8) + 'px';
                    flake.style.filter = `blur(${Math.random() * 2}px)`; flake.style.animationDuration = (Math.random() * 4 + 4) + 's'; 
                    flake.style.animationDelay = Math.random() * -5 + 's'; container.appendChild(flake);
                }
            } else if (species === "雷芽族") {
                let flash = document.createElement('div'); flash.className = 'lightning-flash'; container.appendChild(flash);
                for(let i=0; i<30; i++) {
                    let drop = document.createElement('div'); drop.className = 'rain'; drop.style.left = Math.random() * 100 + 'vw'; 
                    drop.style.background = 'linear-gradient(to bottom, rgba(200,220,255,0), rgba(200,220,255,0.9))';
                    drop.style.animationDuration = (Math.random() * 0.3 + 0.3) + 's'; container.appendChild(drop);
                }
            } else if (species === "創空族") {
                for(let i=0; i<35; i++) {
                    let sparkle = document.createElement('div'); sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * 100 + 'vw'; const size = (Math.random() * 8 + 3) + 'px';
                    sparkle.style.width = sparkle.style.height = size; sparkle.style.background = 'radial-gradient(circle, #ffffff, rgba(253, 224, 71, 0.2))'; 
                    sparkle.style.boxShadow = '0 0 15px rgba(253, 224, 71, 0.8)'; sparkle.style.animationDuration = (Math.random() * 5 + 3) + 's'; 
                    sparkle.style.animationDelay = Math.random() * -5 + 's'; container.appendChild(sparkle);
                }
            } else if (species === "炎灯族") {
                for(let i=0; i<40; i++) {
                    let spark = document.createElement('div'); spark.className = 'sparkle';
                    spark.style.left = Math.random() * 100 + 'vw'; const size = (Math.random() * 6 + 2) + 'px';
                    spark.style.width = spark.style.height = size; spark.style.background = 'radial-gradient(circle, #fff, rgba(249, 115, 22, 0.3))'; 
                    spark.style.boxShadow = '0 0 12px #ea580c, 0 0 20px #ef4444'; spark.style.animationDuration = (Math.random() * 2.5 + 2) + 's'; 
                    spark.style.animationDelay = Math.random() * -3 + 's'; container.appendChild(spark);
                }
            } else if (species === "風旅族") {
                for(let i=0; i<15; i++) {
                    let wind = document.createElement('div'); wind.className = 'wind-line';
                    wind.style.top = (Math.random() * 100) + 'vh'; wind.style.width = (Math.random() * 200 + 150) + 'px';
                    wind.style.opacity = Math.random() * 0.5 + 0.2; wind.style.animationDuration = (Math.random() * 2 + 1) + 's'; 
                    wind.style.animationDelay = Math.random() * -2 + 's'; container.appendChild(wind);
                }
            } else if (species === "虹結族") {
                const colors = ['rgba(254,205,211,0.6)', 'rgba(191,219,254,0.6)', 'rgba(253,230,138,0.6)', 'rgba(187,247,208,0.6)', 'rgba(233,213,255,0.6)'];
                for(let i=0; i<25; i++) {
                    let bubble = document.createElement('div'); bubble.className = 'sparkle'; bubble.style.left = Math.random() * 100 + 'vw';
                    const size = (Math.random() * 40 + 10) + 'px'; bubble.style.width = bubble.style.height = size;
                    bubble.style.background = colors[Math.floor(Math.random() * colors.length)]; bubble.style.boxShadow = '0 0 20px ' + bubble.style.background;
                    bubble.style.animationDuration = (Math.random() * 8 + 4) + 's'; bubble.style.animationDelay = Math.random() * -8 + 's';
                    container.appendChild(bubble);
                }
            } else if (species === "受雲族") {
                for(let i=0; i<10; i++) {
                    let cloud = document.createElement('div'); cloud.className = 'cloud-particle';
                    cloud.style.top = (Math.random() * 80 - 10) + 'vh'; const size = (Math.random() * 300 + 150) + 'px';
                    cloud.style.width = cloud.style.height = size; cloud.style.animationDuration = (Math.random() * 30 + 15) + 's';
                    cloud.style.animationDelay = Math.random() * -20 + 's'; container.appendChild(cloud);
                }
            }
        }
    </script>
</body>
</html>
