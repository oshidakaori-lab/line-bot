<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>空の易</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; text-align: center; width: 300px; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <h1 id="title">読み込み中...</h1>
        <p id="scene"></p>
        <audio id="bgm" loop></audio>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        fetch(`/api/fortune?hid=${params.get('hid')}&l_name=${params.get('l_name')}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('title').innerText = data.name;
                document.getElementById('scene').innerText = data.chiikawa_scene;
                const audio = document.getElementById('bgm');
                audio.src = data.bgm;
                document.body.addEventListener('click', () => audio.play());
            });
    </script>
</body>
</html>
