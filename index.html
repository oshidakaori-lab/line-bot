<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>空の易 - キャラおしゃべり図鑑</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; 
            min-height: 100vh;
            min-height: 100dvh; 
            font-family: 'Zen Maru Gothic', sans-serif;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; background-color: #0f172a;
            overflow-x: hidden;
            color: #f8fafc;
        }

        /* ふわふわ横スクロール用の背景レイヤー */
        .bg-layer {
            position: fixed;
            top: -10vh; left: -25vw; width: 150vw; height: 120vh; 
            background-size: cover; background-position: center;
            z-index: -2;
            animation: fluffyScroll 40s alternate infinite ease-in-out;
        }

        @keyframes fluffyScroll {
            0% { transform: translate(15vw, 2vh) scale(1); }    
            50% { transform: translate(-15vw, -3vh) scale(1.05); } 
            100% { transform: translate(5vw, 0vh) scale(1.02); }   
        }

        /* 文字を読みやすくするための画面全体へのごく薄い暗幕 */
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.15), rgba(15, 23, 42, 0.55));
            z-index: -1;
        }

        #weather-effect {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }

        .ui-wrapper {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ふわふわ浮くアニメーション */
        .card-floater { animation: floatAnimation 5s ease-in-out infinite; width: 100%; }
        @keyframes floatAnimation {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* 🌟 背景完全透過 ＆ 枠線だけを残すスタイル */
        .card {
            background: transparent; /* 背景色を完全に無くす */
            backdrop-filter: none; /* ぼかしも無くす */
            -webkit-backdrop-filter: none;
            padding: 30px 25px; border-radius: 24px;
            text-align: left; width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.35); /* 枠線を美しく際立たせる */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15); /* 枠線が背景に溶けすぎないよう、ふんわりとした影 */
            opacity: 0; transform: scale(0.98);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear { to { opacity: 1; transform: scale(1); } }

        /* 文字がフワッと出てくるアニメーション */
        .animate-item { opacity: 0; transform: translateY(8px); animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.35s; } .delay-4 { animation-delay: 0.45s; } .delay-5 { animation-delay: 0.6s; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* 🌟 背景が透けても文字が読みやすいよう、しっかり影をつける */
        .card h1, .card #sky-title, .card #scene, 
        .card .char-name, .card .dialogue-line span, 
        .card .yoroi-name, .card .yoroi-text {
            text-shadow: 0 2px 5px rgba(0,0,0,0.7);
        }

        /* ヘッダー周り */
        .header-area { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.5rem; margin-bottom: 6px; color: #ffffff; letter-spacing: 1px; }
        .sky-title { font-size: 0.9rem; color: #cbd5e1; font-weight: 400; }

        /* 情景テキスト */
        #scene {
            font-size: 0.95rem; line-height: 1.7; color: #f8fafc;
            margin-bottom: 28px; padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ミニマルなセリフ表示（文字色でキャラクターを表現） */
        .dialogue-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
        .dialogue-line { font-size: 0.95rem; line-height: 1.6; font-weight: 500; display: flex; flex-direction: column; }
        .char-name { font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; color: #ffffff; }
        
        .chiikawa-text { color: #fecdd3; } /* やわらかいピンク */
        .hachiware-text { color: #bfdbfe; } /* クリアな水色 */
        .usagi-text { color: #fef08a; } /* あざやかな黄色 */

        /* 鎧さんの言葉 */
        .advice-box { padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.2); }
        .yoroi-text { color: #fed7aa; font-size: 0.9rem; line-height: 1.6; } /* あたたかいオレンジ */
        .yoroi-name { font-size: 0.75rem; opacity: 0.8; color: #ffffff; margin-bottom: 4px; display: block; }

        .notice { font-size: 0.7rem; color: #cbd5e1; margin-top: 20px; text-align: center; }

        /* シネマティックで華やかな天候エフェクト */
        .rain { position: absolute; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.7)); width: 2px; height: 35px; border-radius: 2px; box-shadow: 0 0 8px rgba(255,255,255,0.4); animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh) scaleY(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(105vh) scaleY(1.5); opacity: 0; } }
        
        .snow { position: absolute; color: rgba(255,255,255,0.95); text-shadow: 0 0 10px rgba(255,255,255,0.6); animation: snowFall linear infinite; }
        @keyframes snowFall { 0% { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(105vh) translateX(60px) rotate(360deg); opacity: 0; } }
        
        .sparkle { position: absolute; border-radius: 50%; filter: blur(1px); animation: riseUp ease-in-out infinite; mix-blend-mode: screen; }
        @keyframes riseUp { 0% { transform: translateY(105vh) scale(0.5); opacity: 0; } 30% { opacity: 0.8; } 70% { opacity: 0.8; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        
        .wind-line { position: absolute; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.4), rgba(255,255,255,0)); height: 3px; border-radius: 50%; filter: blur(2px); animation: blow cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes blow { 0% { transform: translateX(-50vw) scaleX(0.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(150vw) scaleX(2); opacity: 0; } }
        
        .lightning-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top, #fff, rgba(255,255,255,0)); opacity: 0; pointer-events: none; z-index: -1; animation: lightning 6s ease-in-out infinite; mix-blend-mode: overlay; }
        @keyframes lightning { 0%, 91%, 94%, 97%, 100% { opacity: 0; } 92%, 96% { opacity: 0.4; } 95% { opacity: 0.8; } }
        
        .cloud-particle { position: absolute; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; animation: drift linear infinite; mix-blend-mode: screen; }
        @keyframes drift { 0% { transform: translateX(-30vw) scale(0.8); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(120vw) scale(1.2); opacity: 0; } }
    </style>
</head>
<body>

    <div id="bg-layer" class="bg-layer"></div>
    <div id="bg-overlay" class="bg-overlay"></div>
    <div id="weather-effect"></div>

    <div id="ui-wrapper" class="ui-wrapper">
        <div class="card-floater">
            <div class="card" id="main-card">
                
                <div class="header-area animate-item delay-1">
                    <h1 id="title">読み込み中...</h1>
                    <div id="sky-title" class="sky-title"></div>
                </div>
                
                <p id="scene" class="animate-item delay-2">空の様子を探しています...</p>
                
                <div class="dialogue-container">
                    <div class="dialogue-line chiikawa-text animate-item delay-3">
                        <span class="char-name">ちいかわ</span>
                        <span id="chiikawa">...</span>
                    </div>
                    <div class="dialogue-line hachiware-text animate-item delay-4">
                        <span class="char-name">ハチワレ</span>
                        <span id="hachiware">...</span>
                    </div>
                    <div class="dialogue-line usagi-text animate-item delay-5">
                        <span class="char-name">うさぎ</span>
                        <span id="usagi">...</span>
                    </div>
                </div>

                <div class="advice-box animate-item delay-5">
                    <span class="yoroi-name">鎧さんの言葉</span>
                    <p id="advice-text" class="yoroi-text">...</p>
                </div>

                <p id="tap-notice" class="notice">画面タップでBGM再生・停止</p>
                <audio id="bgm-player" loop></audio>
            </div>
        </div>
    </div>

    <script>
        const speciesImages = {
            "創空族": "sky.png", "受雲族": "cloud.png", "雷芽族": "thunder.png", "雨巡族": "rain.png",
            "風旅族": "wind.png", "虹結族": "rainbow.png", "雪守族": "snow.png", "炎灯族": "fire.png"
        };

        const params = new URLSearchParams(window.location.search);
        const hid = params.get('hid') || "1"; 
        const l_name = params.get('l_name') || "1"; 

        fetch(`/api/fortune?hid=${hid}&l_name=${encodeURIComponent(l_name)}`)
            .then(res => res.json())
            .then(data => {
                const species = data.species_8 || "創空族"; 
                const imageFile = speciesImages[species] || "sky.png"; 
                
                document.getElementById('bg-layer').style.backgroundImage = `url('${imageFile}')`;
                startWeatherEffect(species);

                document.getElementById('title').innerText = `${data.name} (${l_name})`;
                document.getElementById('sky-title').innerText = `${data.sky_name || data.soranoeki_sky || "不思議な空"}`;
                document.getElementById('scene').innerText = data.chiikawa_scene;
                
                document.getElementById('chiikawa').innerText = `「${data.chiikawa || '…'}」`;
                document.getElementById('hachiware').innerText = `「${data.hachiware || '…'}」`;
                document.getElementById('usagi').innerText = `「${data.usagi || '…'}」`;
                document.getElementById('advice-text').innerText = data.advice;

                if (data.bgm) {
                    const audio = document.getElementById('bgm-player');
                    audio.src = data.bgm;
                    
                    document.body.addEventListener('click', () => {
                        if (audio.paused) {
                            audio.play().catch(e => console.log(e));
                            document.getElementById('tap-notice').innerText = "🔊 BGM再生中";
                        } else {
                            audio.pause();
                            document.getElementById('tap-notice').innerText = "画面タップでBGM再生・停止";
                        }
                    });
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('title').innerText = "😭 エラー";
                document.getElementById('scene').innerText = "お空のデータがうまく届かなかったみたい…";
            });

        function startWeatherEffect(species) {
            const container = document.getElementById('weather-effect');
            container.innerHTML = ''; 
            
            if (species === "雨巡族") {
                for(let i=0; i<60; i++) {
                    let drop = document.createElement('div'); drop.className = 'rain';
                    drop.style.left = Math.random() * 100 + 'vw'; 
                    drop.style.top = Math.random() * -100 + 'px';
                    const zIndex = Math.random();
                    drop.style.transform = `scale(${zIndex * 0.8 + 0.4})`;
                    drop.style.opacity = zIndex * 0.7 + 0.3;
                    drop.style.animationDuration = (Math.random() * 0.3 + 0.4) + 's'; 
                    drop.style.animationDelay = Math.random() * 2 + 's';
                    container.appendChild(drop);
                }
            } else if (species === "雪守族") {
                const snowChars = ['❄', '･', '❅', '°'];
                for(let i=0; i<40; i++) {
                    let flake = document.createElement('div'); flake.className = 'snow'; 
                    flake.innerHTML = snowChars[Math.floor(Math.random() * snowChars.length)];
                    flake.style.left = Math.random() * 100 + 'vw'; 
                    flake.style.fontSize = (Math.random() * 20 + 8) + 'px';
                    flake.style.filter = `blur(${Math.random() * 2}px)`; 
                    flake.style.animationDuration = (Math.random() * 4 + 4) + 's'; 
                    flake.style.animationDelay = Math.random() * -5 + 's'; 
                    container.appendChild(flake);
                }
            } else if (species === "雷芽族") {
                let flash = document.createElement('div'); flash.className = 'lightning-flash'; container.appendChild(flash);
                for(let i=0; i<30; i++) {
                    let drop = document.createElement('div'); drop.className = 'rain';
                    drop.style.left = Math.random() * 100 + 'vw'; 
                    drop.style.background = 'linear-gradient(to bottom, rgba(200,220,255,0), rgba(200,220,255,0.9))';
                    drop.style.animationDuration = (Math.random() * 0.3 + 0.3) + 's';
                    container.appendChild(drop);
                }
            } else if (species === "創空族") {
                for(let i=0; i<35; i++) {
                    let sparkle = document.createElement('div'); sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * 100 + 'vw'; 
                    const size = (Math.random() * 8 + 3) + 'px';
                    sparkle.style.width = sparkle.style.height = size;
                    sparkle.style.background = 'radial-gradient(circle, #ffffff, rgba(253, 224, 71, 0.2))'; 
                    sparkle.style.boxShadow = '0 0 15px rgba(253, 224, 71, 0.8)';
                    sparkle.style.animationDuration = (Math.random() * 5 + 3) + 's'; 
                    sparkle.style.animationDelay = Math.random() * -5 + 's';
                    container.appendChild(sparkle);
                }
            } else if (species === "炎灯族") {
                for(let i=0; i<40; i++) {
                    let spark = document.createElement('div'); spark.className = 'sparkle';
                    spark.style.left = Math.random() * 100 + 'vw'; 
                    const size = (Math.random() * 6 + 2) + 'px';
                    spark.style.width = spark.style.height = size;
                    spark.style.background = 'radial-gradient(circle, #fff, rgba(249, 115, 22, 0.3))'; 
                    spark.style.boxShadow = '0 0 12px #ea580c, 0 0 20px #ef4444'; 
                    spark.style.animationDuration = (Math.random() * 2.5 + 2) + 's'; 
                    spark.style.animationDelay = Math.random() * -3 + 's';
                    container.appendChild(spark);
                }
            } else if (species === "風旅族") {
                for(let i=0; i<15; i++) {
                    let wind = document.createElement('div'); wind.className = 'wind-line';
                    wind.style.top = (Math.random() * 100) + 'vh'; 
                    wind.style.width = (Math.random() * 200 + 150) + 'px';
                    wind.style.opacity = Math.random() * 0.5 + 0.2;
                    wind.style.animationDuration = (Math.random() * 2 + 1) + 's'; 
                    wind.style.animationDelay = Math.random() * -2 + 's';
                    container.appendChild(wind);
                }
            } else if (species === "虹結族") {
                const colors = ['rgba(254,205,211,0.6)', 'rgba(191,219,254,0.6)', 'rgba(253,230,138,0.6)', 'rgba(187,247,208,0.6)', 'rgba(233,213,255,0.6)'];
                for(let i=0; i<25; i++) {
                    let bubble = document.createElement('div'); bubble.className = 'sparkle'; 
                    bubble.style.left = Math.random() * 100 + 'vw';
                    const size = (Math.random() * 40 + 10) + 'px'; 
                    bubble.style.width = bubble.style.height = size;
                    bubble.style.background = colors[Math.floor(Math.random() * colors.length)]; 
                    bubble.style.boxShadow = '0 0 20px ' + bubble.style.background;
                    bubble.style.animationDuration = (Math.random() * 8 + 4) + 's'; 
                    bubble.style.animationDelay = Math.random() * -8 + 's';
                    container.appendChild(bubble);
                }
            } else if (species === "受雲族") {
                for(let i=0; i<10; i++) {
                    let cloud = document.createElement('div'); cloud.className = 'cloud-particle';
                    cloud.style.top = (Math.random() * 80 - 10) + 'vh'; 
                    const size = (Math.random() * 300 + 150) + 'px';
                    cloud.style.width = cloud.style.height = size; 
                    cloud.style.animationDuration = (Math.random() * 30 + 15) + 's';
                    cloud.style.animationDelay = Math.random() * -20 + 's'; 
                    container.appendChild(cloud);
                }
            }
        }
    </script>
</body>
</html>
